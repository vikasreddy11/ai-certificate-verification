services:
  - type: web
    name: certiverify-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install --no-deps rapidocr-onnxruntime"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: certiverify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ED25519_PRIVATE_KEY_HEX
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: certiverify-db
    plan: free

